      <path d="M755 211H800L818 187L838 242L864 145L895 279L924 126L955 255L980 180L1000 211H1200" stroke-width="1" opacity=".2"/>
    </g>
    <circle cx="1000" cy="190" r="6" fill="#6ef3c5"/>
