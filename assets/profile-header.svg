      <text x="120" y="69" fill="#6ef3c5" font-family="DejaVu Sans Mono,monospace" font-size="13" text-anchor="middle">~/devopvoid</text>
      <text x="56" y="164" fill="#f0f4fc" font-size="66" font-weight="700" letter-spacing="-2">Alex Andres</text>
      <text x="482" y="164" fill="#6ef3c5" font-size="66" font-weight="700">.</text>
      <text x="59" y="211" fill="#aebbd0" font-size="23">Real-time ideas. Open-source code.</text>
