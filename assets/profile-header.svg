<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Alex Andres — devopvoid</title>
  <desc id="desc">Open source. Real-time media. Java meets native. Dark banner with mint and violet signal waves.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#171b30"/></linearGradient>
